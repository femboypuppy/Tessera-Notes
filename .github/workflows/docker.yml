# The server image (`Dockerfile`: the sync server serving the web app).
#
# - Tags: `release.yml` calls this workflow for every `v*` tag. It builds linux/amd64 and
#   linux/arm64 and pushes `ghcr.io/<owner>/tessera` tagged `X.Y.Z`, `X.Y`, `X` (from 1.0 on) and
#   `latest` (stable releases only), with provenance and an SBOM.
# - Manual runs: the same, optionally pushed (tagged with the branch and commit).
# - Pull requests that touch the image: both platforms are built and never pushed.
#
# Each platform builds natively on its own runner (arm64 on `ubuntu-24.04-arm`): under QEMU the
# arm64 install could hang until the job's hour ran out (#56). When pushing, each build pushes its
# image by digest only, and `merge` then tags one manifest list holding both. A build that takes
# far longer than usual fails at its step timeout.
#
# Layers are cached in the GitHub Actions cache, one scope per platform. Pushing uses
# GITHUB_TOKEN (`packages: write`).
name: Docker

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false
  workflow_call:
    inputs:
      push:
        type: boolean
        default: true
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'apps/server/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      # A pull request shows which platform broke; a release can't publish either way.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image kept its name when the repository became Tessera-Notes, so existing
      # `docker pull ghcr.io/<owner>/tessera` commands keep working. GHCR names are lowercase.
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/tessera" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: inputs.push == true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels and annotations of the platform's image; `merge` sets the tags.
      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=Tessera
            org.opencontainers.image.description=Local-first knowledge app: sync server and web app
            org.opencontainers.image.licenses=MIT
      # A native build takes 2 to 8 minutes; one that hangs fails here instead of at the job's end.
      - name: Build${{ inputs.push == true && ' and push by digest' || '' }}
        id: build
        timeout-minutes: 12
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ inputs.push == true }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
          provenance: ${{ inputs.push == true && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push == true }}
      - name: Keep the digest
        if: inputs.push == true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          mkdir -p "$DIGESTS"
          touch "$DIGESTS/${DIGEST#sha256:}"
      - name: Upload the digest
        if: inputs.push == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  merge:
    name: Image
    needs: build
    if: inputs.push == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/tessera" >> "$GITHUB_OUTPUT"
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # A manifest list carries index annotations; each platform's image has its own.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
          labels: |
            org.opencontainers.image.title=Tessera
            org.opencontainers.image.description=Local-first knowledge app: sync server and web app
            org.opencontainers.image.licenses=MIT
      - name: Tag the manifest list
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          mapfile -t annotations < <(jq -r '.annotations[]' <<< "$METADATA")
          for annotation in "${annotations[@]}"; do args+=(--annotation "$annotation"); done
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Check both platforms
        timeout-minutes: 2
        env:
          TAG: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' |
            jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          echo "Platforms: $platforms"
          [ "$platforms" = "linux/amd64,linux/arm64" ]
