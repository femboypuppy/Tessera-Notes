# Releases, for every `v*` tag (`git tag v0.1.0 && git push origin v0.1.0`):
#
# 1. prepare: checks the tag against the app version, writes the changelog from Conventional
#    Commits since the previous tag (under the highlights in `.github/releases/<tag>.md`, when
#    that file exists), and creates a draft GitHub Release with it.
# 2. desktop: `desktop.yml` builds macOS, Windows and Linux bundles into the draft.
# 3. docker: `docker.yml` pushes the multi-arch image to GHCR with the version tags.
# 4. checksums: writes the updater's latest.json from the signed desktop bundles (when the
#    TAURI_SIGNING_* secrets are set; it fails if a system has no signed bundle), then adds
#    SHA256SUMS.txt for every asset.
# 5. publish: publishes the release. If anything fails, the draft stays for you to fix or delete.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Changelog and draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: The tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/github-release.ts verify-version --tag "$TAG"
      - name: Changelog
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/release/changelog.ts --to "$TAG" --repo "$REPOSITORY"
          --intro ".github/releases/$TAG.md" --output release-notes.md
      - name: Draft release
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: node scripts/release/github-release.ts draft --tag "$TAG" --notes release-notes.md
      - name: Upload the notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  desktop:
    name: Desktop
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      release-id: ${{ needs.prepare.outputs.release-id }}
      tag: ${{ github.ref_name }}
    secrets: inherit

  docker:
    name: Docker
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      push: true

  checksums:
    name: Updater manifest and checksums
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: node scripts/release/github-release.ts updater-json --release-id "$RELEASE_ID"
      - name: SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: node scripts/release/github-release.ts checksums --release-id "$RELEASE_ID"

  publish:
    name: Publish
    needs: [prepare, desktop, docker, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: node scripts/release/github-release.ts publish --release-id "$RELEASE_ID"
