# Desktop builds (Tauri 2) for macOS (Apple silicon and Intel), Windows and Linux.
#
# - Tags: `release.yml` calls this workflow for every `v*` tag with the draft release's ID, and the
#   bundles (plus each updater bundle's `.sig` when a signing key is configured) go to that
#   release. `release.yml` then writes the updater's `latest.json` from those signatures.
# - Manual runs and pull requests that touch the desktop app: the bundles are workflow artifacts.
#
# Secrets (all optional; see HANDOFF/ci.md): TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD sign updater bundles; APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID
# sign and notarize the macOS app.
name: Desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-id:
        description: ID of the draft GitHub Release to upload the bundles to.
        type: string
        required: true
      tag:
        description: The release tag (for the updater's download URLs).
        type: string
        required: true
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/src/features/desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      # Uploading to the draft release (tag builds only).
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # 22.04 keeps the AppImage and .deb compatible with older glibc versions.
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      # Updater bundles need the signing key, so they are only built when it is configured, and
      # the app then embeds the public key (the TAURI_SIGNING_PUBLIC_KEY variable) to verify them;
      # tauri.conf.json only holds a placeholder. The action splits `args` like a shell, so the
      # inline JSON is single-quoted.
      - name: Build options
        id: options
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          args="--target $TARGET"
          # The key is one line of base64; a newline pasted with it would break the JSON below.
          UPDATER_PUBLIC_KEY="$(printf '%s' "$UPDATER_PUBLIC_KEY" | tr -d '[:space:]')"
          echo "pubkey=$UPDATER_PUBLIC_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            if [ -z "$UPDATER_PUBLIC_KEY" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but the TAURI_SIGNING_PUBLIC_KEY variable is not: the app could not verify its updates."
              exit 1
            fi
            config="{\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$UPDATER_PUBLIC_KEY\"}}}"
            args="$args --config '$config'"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      # A secret that isn't set arrives as an empty string, and the Tauri CLI takes an empty
      # APPLE_CERTIFICATE for a certificate to import ("failed to import keychain certificate"),
      # so only the signing secrets that are set reach the build. Without Apple's, the macOS app
      # is ad-hoc signed (`signingIdentity: "-"` in tauri.conf.json). An updater key's password
      # goes along even when empty, so the CLI never asks for one.
      - name: Signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_secret() {
            local delimiter="END_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
            { echo "$1<<$delimiter"; printf '%s\n' "${!1}"; echo "$delimiter"; } >> "$GITHUB_ENV"
            echo "$1 is set."
          }
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then export_secret "$name"; fi
          done
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            export_secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
      - name: Tauri build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          args: ${{ steps.options.outputs.args }}
          # Empty outside tag builds, so the action only builds and the bundles become artifacts.
          releaseId: ${{ inputs.release-id }}
          tagName: ${{ inputs.tag }}
          releaseDraft: ${{ inputs.release-id != '' }}
          uploadWorkflowArtifacts: ${{ inputs.release-id == '' }}
          workflowArtifactNamePattern: tessera-[platform]-[arch]-[bundle]
          # The four builds run in parallel, and each would read, extend and re-upload one shared
          # latest.json, so two finishing together could drop a platform. The signatures go up
          # here; release.yml writes latest.json once from them, after every build.
          uploadUpdaterSignatures: true
          uploadUpdaterJson: false
      # A signed build whose app doesn't carry the public key could never verify an update: check
      # the compiled binary (the config, key included, is embedded as plain text).
      - name: The app carries the updater's public key
        if: steps.options.outputs.pubkey != '' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          UPDATER_PUBLIC_KEY: ${{ steps.options.outputs.pubkey }}
        run: |
          binary="apps/desktop/src-tauri/target/$TARGET/release/tessera-desktop"
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; fi
          if grep -qF "$UPDATER_PUBLIC_KEY" "$binary"; then
            echo "$binary embeds the updater's public key."
          else
            echo "::error::$binary doesn't contain the TAURI_SIGNING_PUBLIC_KEY variable's key."
            exit 1
          fi
