# The documentation site (VitePress in `docs/`, a standalone pnpm project with its own lockfile), and
# the default plugin registry in its `plugins/` folder (the example plugins' zips and registry.json,
# which Settings → Plugins → Browse reads). Pull requests build both (VitePress fails on dead links);
# pushes to main also deploy them to GitHub Pages, then check the published registry from outside.
# One-time setting: Settings → Pages → Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/brand/**'
      - '.github/workflows/docs.yml'
      - 'examples/plugins/**'
      - 'packages/plugins/**'
      - 'packages/plugin-api/**'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/brand/**'
      - '.github/workflows/docs.yml'
      - 'examples/plugins/**'
      - 'packages/plugins/**'
      - 'packages/plugin-api/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a deployment halfway.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the "last updated" dates.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            pnpm-lock.yaml
      - name: Pages settings
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      # Deployments use the Pages base path ("/<repo>/", or "/" on a custom domain); pull requests
      # keep the config's default.
      - name: Build
        working-directory: docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then export DOCS_BASE="$BASE_PATH/"; fi
          pnpm build
      - name: Install the monorepo (to build the example plugins)
        run: pnpm install --frozen-lockfile
      # Every URL in registry.json comes from the site's address (pull requests use the app's
      # default), and every zip gets its SHA-256.
      - name: Plugin registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          args=(--out docs/.vitepress/dist/plugins)
          if [ "$EVENT_NAME" != "pull_request" ]; then args+=(--base-url "$SITE_URL/plugins/"); fi
          pnpm --filter @tessera/plugins build:registry "${args[@]}"
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The registry as the apps will fetch it: the app's DEFAULT_REGISTRY_URL inside the deployed site,
  # registry.json matching its schema, and every zip answering with the listed SHA-256 and a CORS
  # header any origin (web, desktop, self-hosted) can read.
  registry:
    name: Registry check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the published registry
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page-url }}
        run: pnpm --filter @tessera/plugins check:registry --site "$PAGE_URL"
