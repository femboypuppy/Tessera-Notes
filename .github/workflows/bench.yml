# Benchmarks (scripts/bench): cold start with 5,000 pages, search, the palette, opening a
# 2,000-block page, typing latency, the graph and importing 2,000 files, in Chromium against the
# real app with a generated workspace.
#
# - main: the results become the baseline (kept in the Actions cache).
# - Pull requests: the results are compared with the latest baseline from main and posted as one
#   comment that updates on every push. Never blocking: runners are noisy, and the budgets are
#   enforced by each feature's own tests and by the bundle check in ci.yml.
name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/bench/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/bench.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/bench/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Baseline from main
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-baseline
          key: bench-main-${{ github.sha }}
          restore-keys: bench-main-
      - name: Run the benchmarks
        run: pnpm exec tsx scripts/bench/run.ts --out bench-results --compare bench-baseline/results.json
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep the results as the baseline
        if: github.ref == 'refs/heads/main'
        run: mkdir -p bench-baseline && cp bench-results/results.json bench-baseline/results.json
      - name: Save the baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-baseline
          key: bench-main-${{ github.sha }}
      # Pull requests from forks get a read-only token, so they only get the job summary.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: benchmarks
          path: bench-results/results.md
